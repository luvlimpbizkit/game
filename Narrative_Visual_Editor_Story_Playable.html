<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Narrative Visual Editor Project</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
  #game { max-width: 640px; width: 100%; background: #1e293b; border-radius: 12px; padding: 2.5rem; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); border: 1px solid #334155; }
  #passage-title { font-size: 0.9rem; color: #38bdf8; margin-bottom: 1.5rem; text-transform: uppercase; letter-spacing: 1px; font-family: sans-serif; font-weight: 700; }
  #passage-text { font-size: 1.1rem; line-height: 1.8; white-space: pre-wrap; margin-bottom: 2rem; }
  .choice-btn { display: block; width: 100%; text-align: left; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; padding: 0.85rem 1.1rem; margin-bottom: 0.7rem; font-size: 0.95rem; cursor: pointer; font-family: sans-serif; transition: 0.15s; }
  .choice-btn:hover { background: #38bdf8; color: #0f172a; border-color: #38bdf8; font-weight: 600; }
  #end-msg { font-style: italic; color: #94a3b8; margin-top: 1rem; font-family: sans-serif; }
  #restart-btn { margin-top: 1.5rem; background: none; border: 1px solid #475569; color: #94a3b8; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-family: sans-serif; }
  #restart-btn:hover { color: #f8fafc; border-color: #94a3b8; }
</style>
</head>
<body>
  <div id="game">
    <div id="passage-title"></div>
    <div id="passage-text"></div>
    <div id="choices"></div>
    <button id="restart-btn">Restart</button>
  </div>

  <script>
    var STORY = {"nodes":[{"id":"Node_1","type":"standard","role":null,"title":"doors","text":"the player sees 3 doors; red, blue and green","code":""},{"id":"Node_2","type":"terminal","role":"start","title":"Start","text":"Write narrative text for Start_2 here...","code":""},{"id":"Node_3","type":"event","role":null,"title":"red","text":"the player sees a crucifix and decides whether to pick it up or not ","code":""},{"id":"Node_4","type":"event","role":null,"title":"blue","text":"you see a person and decide to question them","code":""},{"id":"Node_5","type":"event","role":null,"title":"green","text":"nothing behind this door ","code":""},{"id":"Node_6","type":"event","role":null,"title":"crucifix yes","text":"the player picks this item up ","code":""},{"id":"Node_7","type":"event","role":null,"title":"crucifix no","text":"the player does not pick this item up","code":""},{"id":"Node_9","type":"npc","role":null,"title":"character 1","text":"asks what the player wants and the player can choose to see their id, analyse their looks, use a picked up item or leave","code":""},{"id":"Node_10","type":"event","role":null,"title":"option 4 ","text":"player has left and the person inside may be supernatural ","code":""},{"id":"Node_11","type":"event","role":null,"title":"option 1","text":"the id is perfectly fine ","code":""},{"id":"Node_12","type":"event","role":null,"title":"option 2 ","text":"person is normal looking and does not show any bad signs ","code":""},{"id":"Node_13","type":"terminal","role":"end","title":"happy ending ","text":"Write narrative text for Ending_13 here...","code":""},{"id":"Node_14","type":"event","role":null,"title":"option 3","text":"see if player has picked anything up to use ","code":""},{"id":"Node_15","type":"standard","role":null,"title":"new doors ","text":"find a new house to investigate the owners ","code":""},{"id":"Node_16","type":"terminal","role":"end","title":"everyones dead","text":"Write narrative text for Ending_16 here...","code":""}],"connections":[{"from":"Node_2","to":"Node_1","label":"doors","conditionVar":"","conditionOp":"==","conditionVal":""},{"from":"Node_1","to":"Node_3","label":"red","conditionVar":"","conditionOp":"==","conditionVal":""},{"from":"Node_1","to":"Node_4","label":"blue","conditionVar":"","conditionOp":"==","conditionVal":""},{"from":"Node_1","to":"Node_5","label":"green","conditionVar":"","conditionOp":"==","conditionVal":""},{"from":"Node_3","to":"Node_6","label":"pick up","conditionVar":"","conditionOp":"==","conditionVal":""},{"from":"Node_3","to":"Node_7","label":"leave it ","conditionVar":"","conditionOp":"==","conditionVal":""},{"from":"Node_4","to":"Node_9","label":"next","conditionVar":"","conditionOp":"==","conditionVal":""},{"from":"Node_9","to":"Node_10","label":"leave","conditionVar":"","conditionOp":"==","conditionVal":""},{"from":"Node_9","to":"Node_11","label":"ask for id","conditionVar":"","conditionOp":"==","conditionVal":""},{"from":"Node_9","to":"Node_12","label":"analyse looks ","conditionVar":"","conditionOp":"==","conditionVal":""},{"from":"Node_5","to":"Node_15","label":"find new house","conditionVar":"","conditionOp":"==","conditionVal":""},{"from":"Node_7","to":"Node_15","label":"find new house","conditionVar":"","conditionOp":"==","conditionVal":""},{"from":"Node_6","to":"Node_15","label":"find new house","conditionVar":"","conditionOp":"==","conditionVal":""},{"from":"Node_10","to":"Node_15","label":"find new house","conditionVar":"","conditionOp":"==","conditionVal":""},{"from":"Node_15","to":"Node_13","label":"Proceed","conditionVar":"","conditionOp":"==","conditionVal":""},{"from":"Node_11","to":"Node_15","label":"find new house","conditionVar":"","conditionOp":"==","conditionVal":""},{"from":"Node_12","to":"Node_15","label":"find new house","conditionVar":"","conditionOp":"==","conditionVal":""},{"from":"Node_14","to":"Node_15","label":"find new house ","conditionVar":"","conditionOp":"==","conditionVal":""},{"from":"Node_10","to":"Node_16","label":"Proceed","conditionVar":"","conditionOp":"==","conditionVal":""},{"from":"Node_9","to":"Node_14","label":"use any items picked up","conditionVar":"","conditionOp":"==","conditionVal":""}],"variables":[]};
    var vars = {};

    function evalExpr(expr) {
      var t = expr.trim().replace(/\$([a-zA-Z_][a-zA-Z0-9_]*)/g, function (m, n) { return 'vars["$' + n + '"]'; });
      return Function('vars', '"use strict"; return (' + t + ');')(vars);
    }

    function initVars() {
      vars = {};
      STORY.variables.forEach(function (v) {
        var raw = v.value;
        vars[v.name] = (raw !== '' && !isNaN(raw)) ? Number(raw) : raw;
      });
    }

    function findNode(id) {
      for (var i = 0; i < STORY.nodes.length; i++) if (STORY.nodes[i].id === id) return STORY.nodes[i];
      return null;
    }

    function renderNode(node) {
      if (node.code) {
        var setRe = /<<set\s+\$([a-zA-Z_][a-zA-Z0-9_]*)\s+to\s+(.+?)>>/g;
        var m;
        while ((m = setRe.exec(node.code))) {
          try { vars['$' + m[1]] = evalExpr(m[2]); } catch (e) { }
        }
      }

      document.getElementById('passage-title').textContent = node.title;
      document.getElementById('passage-text').textContent = node.text;

      var outConns = STORY.connections.filter(function (c) { return c.from === node.id; }).filter(function (c) {
        if (!c.conditionVar || c.conditionVal === '') return true;
        try {
          var left = evalExpr(c.conditionVar);
          var right = isNaN(c.conditionVal) ? c.conditionVal : Number(c.conditionVal);
          switch (c.conditionOp) {
            case '==': return left == right;
            case '!=': return left != right;
            case '>=': return left >= right;
            case '<=': return left <= right;
            case '>': return left > right;
            case '<': return left < right;
            default: return true;
          }
        } catch (e) { return true; }
      });

      var choicesEl = document.getElementById('choices');
      choicesEl.innerHTML = '';
      if (outConns.length === 0) {
        var msg = document.createElement('div');
        msg.id = 'end-msg';
        msg.textContent = (node.type === 'terminal' && node.role === 'end') ? '\u2014 The End \u2014' : '(No further choices)';
        choicesEl.appendChild(msg);
      } else {
        outConns.forEach(function (c) {
          var target = findNode(c.to);
          if (!target) return;
          var btn = document.createElement('button');
          btn.className = 'choice-btn';
          btn.textContent = c.label || 'Continue';
          btn.addEventListener('click', function () { renderNode(target); });
          choicesEl.appendChild(btn);
        });
      }
    }

    function start() {
      var startNode = null;
      for (var i = 0; i < STORY.nodes.length; i++) {
        if (STORY.nodes[i].type === 'terminal' && STORY.nodes[i].role === 'start') { startNode = STORY.nodes[i]; break; }
      }
      if (!startNode) {
        document.getElementById('passage-text').textContent = 'This story has no Start passage set.';
        return;
      }
      initVars();
      renderNode(startNode);
    }

    document.getElementById('restart-btn').addEventListener('click', start);
    start();
  </script>
</body>
</html>
